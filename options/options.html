<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="html_options_title"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <img class="brand-icon" src="../assets/icons/icon48.png" alt="" width="36" height="36">
      <div class="header-copy">
        <h1 class="page-title">Baka Translator</h1>
        <p class="page-subtitle" data-i18n="html_options_subtitle"></p>
      </div>
      <span id="versionChip" class="version-chip">v—</span>
    </header>

    <div class="tabs" role="tablist" data-i18n-aria-label="html_settings_categories">
      <button id="tab-general" class="tab" type="button" role="tab" aria-selected="true" aria-controls="panel-general" tabindex="0" data-i18n="html_general_tab"></button>
      <button id="tab-advanced" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-advanced" tabindex="-1" data-i18n="html_advanced_tab"></button>
    </div>

    <main>
      <section id="panel-general" class="panel" role="tabpanel" aria-labelledby="tab-general" tabindex="0">
        <section class="section" aria-labelledby="modelAccessTitle">
          <h2 id="modelAccessTitle" class="section-title" data-i18n="html_model_access_title"></h2>
          <p class="section-desc" data-i18n="html_model_access_description"></p>

          <div id="modelsLoadError" class="notice notice-error" role="status" aria-live="polite" hidden>
            <p id="modelsLoadErrorText" class="notice-text" data-i18n="html_model_list_fallback"></p>
            <button id="reloadModelsButton" class="notice-action" type="button" data-i18n="html_reload"></button>
          </div>

          <p id="translationSummary" class="model-details" data-i18n="html_translation_summary_initial"></p>
          <p id="polishSummary" class="model-details" data-i18n="html_polish_summary_initial"></p>

          <h3 class="subsection-title" data-i18n="html_provider"></h3>
          <div class="provider-manager">
            <nav class="provider-nav" data-i18n-aria-label="html_provider_list">
              <ul id="providerNav" class="provider-nav-list"></ul>
              <button id="addProviderButton" class="button button-secondary button-compact provider-add" type="button" data-i18n="html_add_provider"></button>
            </nav>

            <section id="providerDetail" class="provider-detail" aria-labelledby="providerDetailTitle">
              <div class="provider-detail-head">
                <h4 id="providerDetailTitle" class="provider-detail-title">—</h4>
                <span id="providerDetailTags" class="provider-tags"></span>
              </div>
              <p id="keyStatus" class="key-status" data-tone="muted" data-i18n="html_api_key_missing"></p>

              <div id="customProviderFields" class="provider-custom" hidden>
                <p class="hint" data-i18n="html_custom_provider_hint"></p>
                <div class="field">
                  <label class="field-label" for="providerNameInput" data-i18n="html_provider_name"></label>
                  <input id="providerNameInput" class="text-input" type="text" maxlength="60" data-i18n-placeholder="html_provider_name_placeholder" autocomplete="off" spellcheck="false">
                </div>
                <div class="field">
                  <label class="field-label" for="customEndpointInput" data-i18n="html_endpoint_label"></label>
                  <input id="customEndpointInput" class="text-input" type="text" data-i18n-placeholder="html_endpoint_placeholder" autocomplete="off" spellcheck="false">
                </div>
                <div class="field">
                  <label class="field-label" for="customModelInput" data-i18n="html_model_name_label"></label>
                  <input id="customModelInput" class="text-input" type="text" maxlength="200" data-i18n-placeholder="html_model_name_placeholder" autocomplete="off" spellcheck="false">
                </div>
                <div class="button-row">
                  <button id="saveCustomProviderButton" class="button button-primary" type="button" data-i18n="html_save_provider"></button>
                  <button id="deleteProviderButton" class="button button-ghost-danger" type="button" hidden data-i18n="html_delete_provider"></button>
                </div>
                <p id="customProviderFeedback" class="feedback" role="status" aria-live="polite"></p>
              </div>

              <div id="providerKeyFields">
                <div class="field">
                  <label class="field-label" for="apiKeyInput" id="providerKeyLabel" data-i18n="html_api_key"></label>
                  <div class="input-row">
                    <input id="apiKeyInput" class="text-input" type="password" data-i18n-placeholder="html_api_key_placeholder" autocomplete="off" spellcheck="false" autocapitalize="off" maxlength="512" aria-describedby="apiKeyHint keyFeedback">
                    <button id="toggleKeyVisibility" class="button button-secondary button-compact" type="button" aria-pressed="false" data-i18n-aria-label="html_show_api_key" data-i18n="html_show"></button>
                  </div>
                  <p id="apiKeyHint" class="hint" data-i18n="html_saved_key_hint"></p>
                </div>
                <div class="button-row">
                  <button id="saveKeyButton" class="button button-primary" type="button" data-i18n="html_save_api_key"></button>
                  <button id="testConnectionButton" class="button button-secondary" type="button" disabled data-i18n="html_test_connection"></button>
                  <button id="clearKeyButton" class="button button-ghost-danger" type="button" hidden data-i18n="html_clear_api_key"></button>
                </div>
              </div>
              <p id="providerDraftHint" class="hint" hidden data-i18n="html_provider_draft_hint"></p>
              <p id="keyFeedback" class="feedback" role="status" aria-live="polite"></p>

              <div id="providerModelFields" class="provider-models" hidden>
                <div class="provider-detail-head">
                  <h4 class="provider-detail-title" data-i18n="html_available_models"></h4>
                  <button id="fetchProviderModelsButton" class="button button-secondary button-compact" type="button" aria-describedby="fetchProviderModelsHint providerModelFeedback" data-i18n="html_fetch_models"></button>
                </div>
                <p id="fetchProviderModelsHint" class="hint" data-i18n="html_fetch_models_hint"></p>
                <ul id="providerModelList" class="provider-model-list" data-i18n-aria-label="html_provider_models_label"></ul>
                <div class="field">
                  <label class="field-label" for="userModelInput" data-i18n="html_add_model_name"></label>
                  <div class="input-row">
                    <input id="userModelInput" class="text-input" type="text" maxlength="200" data-i18n-placeholder="html_model_id_placeholder" autocomplete="off" spellcheck="false" aria-describedby="userModelHint providerModelFeedback">
                    <button id="addUserModelButton" class="button button-secondary button-compact" type="button" data-i18n="html_add"></button>
                  </div>
                  <p id="userModelHint" class="hint" data-i18n="html_user_model_hint"></p>
                  <p id="providerModelFeedback" class="feedback" role="status" aria-live="polite"></p>
                </div>
              </div>
            </section>
          </div>
          <p class="hint" data-i18n="html_connection_test_hint"></p>
        </section>

        <section class="section" aria-labelledby="defaultsTitle">
          <h2 id="defaultsTitle" class="section-title" data-i18n="html_defaults_title"></h2>
          <p class="section-desc" data-i18n="html_defaults_description"></p>

          <div class="settings-grid">
            <div class="field">
              <label class="field-label" for="defaultTargetSelect" data-i18n="html_default_target"></label>
              <span class="select-wrap">
                <select id="defaultTargetSelect" class="select" data-i18n-aria-label="html_default_target"></select>
              </span>
            </div>
            <div class="field">
              <span class="field-label" id="defaultBilingualLabel" data-i18n="html_keep_original"></span>
              <div class="switch-row">
                <label class="switch">
                  <input id="defaultBilingualToggle" type="checkbox" role="switch" aria-labelledby="defaultBilingualLabel" aria-describedby="defaultBilingualHint">
                  <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
                </label>
              </div>
              <p id="defaultBilingualHint" class="hint" data-i18n="html_bilingual_hint"></p>
            </div>
          </div>

          <p id="settingsFeedback" class="feedback" role="status" aria-live="polite"></p>
        </section>

        <section class="section" aria-labelledby="usageTitle">
          <h2 id="usageTitle" class="section-title" data-i18n="html_usage_title"></h2>
          <p class="section-desc" data-i18n="html_usage_description"></p>

          <div class="usage-panel">
            <div class="usage-total-row">
              <p class="usage-total-main">
                <span class="usage-total" id="usageTotal">—</span>
                <span class="usage-total-label" data-i18n="html_total_tokens"></span>
              </p>
              <p class="usage-cost-main">
                <span class="usage-cost-label" data-i18n="html_estimated_cost"></span>
                <strong id="usageCost" class="usage-cost">—</strong>
              </p>
            </div>
            <dl class="usage-grid">
              <div class="usage-cell">
                <dt data-i18n="html_input_tokens"></dt>
                <dd id="usagePrompt">—</dd>
              </div>
              <div class="usage-cell">
                <dt data-i18n="html_output_tokens"></dt>
                <dd id="usageCompletion">—</dd>
              </div>
              <div class="usage-cell">
                <dt data-i18n="html_cached_tokens"></dt>
                <dd id="usageCached">—</dd>
              </div>
              <div class="usage-cell">
                <dt data-i18n="html_recorded_requests"></dt>
                <dd id="usageRequests">—</dd>
              </div>
              <div class="usage-cell">
                <dt data-i18n="html_last_updated"></dt>
                <dd id="usageUpdated">—</dd>
              </div>
            </dl>
          </div>

          <p id="usageEmptyHint" class="hint usage-empty" hidden data-i18n="html_usage_empty"></p>
          <p id="usageFeedback" class="feedback" role="status" aria-live="polite"></p>
          <div class="button-row">
            <button id="resetUsageButton" class="button button-ghost-danger" type="button" data-i18n-aria-label="html_reset_usage_label" data-i18n="html_reset_usage"></button>
          </div>
        </section>

        <section class="section" aria-labelledby="shortcutsTitle">
          <h2 id="shortcutsTitle" class="section-title" data-i18n="html_shortcuts_title"></h2>
          <dl class="shortcut-list">
            <div class="shortcut-row">
              <dt data-i18n="html_shortcut_page"></dt>
              <dd><kbd data-i18n="html_key_alt"></kbd><span class="kbd-plus" aria-hidden="true">+</span><kbd data-i18n="html_key_shift"></kbd><span class="kbd-plus" aria-hidden="true">+</span><kbd data-i18n="html_key_y"></kbd></dd>
            </div>
            <div class="shortcut-row">
              <dt data-i18n="html_translate_selection"></dt>
              <dd><kbd data-i18n="html_key_alt"></kbd><span class="kbd-plus" aria-hidden="true">+</span><kbd data-i18n="html_key_shift"></kbd><span class="kbd-plus" aria-hidden="true">+</span><kbd data-i18n="html_key_s"></kbd></dd>
            </div>
            <div class="shortcut-row">
              <dt data-i18n="html_translate_images"></dt>
              <dd><kbd data-i18n="html_key_alt"></kbd><span class="kbd-plus" aria-hidden="true">+</span><kbd data-i18n="html_key_shift"></kbd><span class="kbd-plus" aria-hidden="true">+</span><kbd data-i18n="html_key_u"></kbd></dd>
            </div>
          </dl>
          <p class="hint" data-i18n="html_shortcuts_hint"></p>
        </section>

        <section class="section" aria-labelledby="privacyTitle">
          <h2 id="privacyTitle" class="section-title" data-i18n="html_privacy_title"></h2>
          <ul class="plain-list">
            <li data-i18n="html_privacy_images"></li>
            <li data-i18n="html_privacy_requests"></li>
            <li data-i18n="html_privacy_pretranslation"></li>
            <li data-i18n="html_privacy_keys"></li>
            <li data-i18n="html_privacy_network"></li>
            <li data-i18n="html_privacy_permissions"></li>
          </ul>
        </section>

        <section class="section" aria-labelledby="aboutTitle">
          <h2 id="aboutTitle" class="section-title" data-i18n="html_about_title"></h2>
          <dl class="about-list">
            <div class="about-row">
              <dt data-i18n="html_version_label"></dt>
              <dd id="versionText">—</dd>
            </div>
            <div class="about-row">
              <dt data-i18n="html_current_model"></dt>
              <dd id="modelText">—</dd>
            </div>
          </dl>
        </section>
      </section>

      <section id="panel-advanced" class="panel" role="tabpanel" aria-labelledby="tab-advanced" tabindex="0" hidden>
        <p id="novelSupportNote" class="advanced-note" data-i18n="html_novel_support_note"></p>

        <section class="section" aria-labelledby="behaviorTitle">
          <h2 id="behaviorTitle" class="section-title" data-i18n="html_model_behavior_title"></h2>
          <p class="section-desc" data-i18n="html_model_behavior_description"></p>

          <div class="model-row">
            <div class="model-column" aria-labelledby="translationModelHeading">
              <h3 id="translationModelHeading" class="subsection-title" data-i18n="html_translation_model"></h3>
              <div class="field">
                <label class="field-label" for="translationProviderSelect" data-i18n="html_provider"></label>
                <span class="select-wrap">
                  <select id="translationProviderSelect" class="select" data-i18n-aria-label="html_translation_provider" aria-describedby="modelDetails"></select>
                </span>
              </div>
              <div class="field">
                <label class="field-label" for="modelSelect" data-i18n="html_model"></label>
                <span class="select-wrap">
                  <select id="modelSelect" class="select" data-i18n-aria-label="html_translation_model" aria-describedby="modelDetails effortHint"></select>
                </span>
                <p id="modelDetails" class="model-details">—</p>
              </div>
              <div class="field">
                <label class="field-label" for="effortSelect" data-i18n="html_reasoning_effort"></label>
                <span class="select-wrap">
                  <select id="effortSelect" class="select" data-i18n-aria-label="html_translation_effort" aria-describedby="effortHint"></select>
                </span>
                <p id="effortHint" class="hint">——</p>
              </div>
            </div>

            <div class="model-column" aria-labelledby="polishModelHeading">
              <h3 id="polishModelHeading" class="subsection-title" data-i18n="html_polish_model"></h3>
              <div class="field">
                <label class="field-label" for="polishProviderSelect" data-i18n="html_provider"></label>
                <span class="select-wrap">
                  <select id="polishProviderSelect" class="select" data-i18n-aria-label="html_polish_provider" aria-describedby="polishModelDetails"></select>
                </span>
              </div>
              <div class="field">
                <label class="field-label" for="polishModelSelect" data-i18n="html_model"></label>
                <span class="select-wrap">
                  <select id="polishModelSelect" class="select" data-i18n-aria-label="html_polish_model" aria-describedby="polishModelDetails polishEffortHint"></select>
                </span>
                <p id="polishModelDetails" class="model-details">—</p>
              </div>
              <div class="field">
                <label class="field-label" for="polishEffortSelect" data-i18n="html_reasoning_effort"></label>
                <span class="select-wrap">
                  <select id="polishEffortSelect" class="select" data-i18n-aria-label="html_polish_effort" aria-describedby="polishEffortHint"></select>
                </span>
                <p id="polishEffortHint" class="hint">——</p>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="presetSelect" data-i18n="html_global_preset"></label>
            <span class="select-wrap">
              <select id="presetSelect" class="select" data-i18n-aria-label="html_global_preset" aria-describedby="presetDescription"></select>
            </span>
            <p id="presetDescription" class="hint">——</p>
          </div>

          <p id="behaviorFeedback" class="feedback" role="status" aria-live="polite"></p>
        </section>

        <section class="section" aria-labelledby="promptsTitle">
          <h2 id="promptsTitle" class="section-title" data-i18n="html_prompts_title"></h2>
          <p class="section-desc" data-i18n="html_prompts_description"></p>
          <p id="promptPlaceholders" class="hint code-hint" data-i18n="html_prompt_placeholders"></p>

          <div class="field">
            <label class="field-label" for="translationPromptInput" data-i18n="html_translation_prompt"></label>
            <textarea id="translationPromptInput" class="text-area" rows="7" spellcheck="false" aria-describedby="promptStatus promptFeedback"></textarea>
          </div>
          <div class="field">
            <label class="field-label" for="polishPromptInput" data-i18n="html_polish_prompt"></label>
            <textarea id="polishPromptInput" class="text-area" rows="7" spellcheck="false" aria-describedby="promptStatus promptFeedback"></textarea>
          </div>

          <p id="promptStatus" class="hint" data-i18n="html_prompt_defaults_status"></p>
          <p id="promptFeedback" class="feedback" role="status" aria-live="polite"></p>
          <div class="button-row">
            <button id="savePromptsButton" class="button button-primary" type="button" data-i18n="html_save_prompts"></button>
            <button id="resetPromptsButton" class="button button-ghost-danger" type="button" data-i18n="html_restore_defaults"></button>
          </div>
        </section>

        <section class="section" aria-labelledby="sitesTitle">
          <h2 id="sitesTitle" class="section-title" data-i18n="html_sites_title"></h2>
          <p class="section-desc" data-i18n="html_sites_description"></p>

          <div id="siteList" class="site-list" data-i18n-aria-label="html_configured_sites"></div>
          <p id="siteEmptyHint" class="hint usage-empty" hidden data-i18n="html_sites_empty"></p>

          <div class="field">
            <label class="field-label" for="siteHostInput" data-i18n="html_add_site"></label>
            <div class="input-row">
              <input id="siteHostInput" class="text-input" type="text" data-i18n-placeholder="html_site_placeholder" autocomplete="off" spellcheck="false" aria-describedby="siteFeedback">
              <button id="addSiteButton" class="button button-secondary button-compact" type="button" data-i18n="html_add_site"></button>
            </div>
            <p id="siteFeedback" class="feedback" role="status" aria-live="polite"></p>
          </div>
        </section>

        <section class="section" aria-labelledby="glossaryTitle">
          <h2 id="glossaryTitle" class="section-title" data-i18n="html_glossary_title"></h2>
          <p class="section-desc" data-i18n="html_glossary_description"></p>

          <div class="glossary-tidy">
            <div class="glossary-tidy-switch">
              <span class="field-label" id="glossaryTidyLabel" data-i18n="html_glossary_cleanup_toggle"></span>
              <label class="switch">
                <input id="glossaryTidyToggle" type="checkbox" role="switch" aria-labelledby="glossaryTidyLabel" aria-describedby="glossaryTidyHint">
                <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              </label>
            </div>
            <div class="glossary-tidy-fields">
              <label class="glossary-pager-field"><span data-i18n="html_glossary_cleanup_every"></span>
                <input id="glossaryTidyChapters" class="text-input" type="number" min="1" max="500" step="1" data-i18n-aria-label="html_glossary_cleanup_interval_label">
                <span data-i18n="html_glossary_cleanup_chapters"></span>
              </label>
              <label class="glossary-pager-field"><span data-i18n="html_glossary_cleanup_use"></span>
                <select id="glossaryTidyModel" class="select" data-i18n-aria-label="html_glossary_cleanup_model_label">
                  <option value="translation" data-i18n="html_translation_model"></option>
                  <option value="polish" data-i18n="html_polish_model"></option>
                </select>
              </label>
            </div>
            <p id="glossaryTidyHint" class="hint" data-i18n="html_glossary_cleanup_hint"></p>
            <p id="glossaryTidyFeedback" class="feedback" role="status" aria-live="polite"></p>
          </div>

          <div class="glossary-head">
            <div id="glossaryList" class="glossary-list" data-i18n-aria-label="html_glossary_list_label"></div>
            <button id="glossaryRefreshButton" class="button button-secondary button-compact" type="button" data-i18n="html_refresh_list"></button>
          </div>
          <p id="glossaryEmptyHint" class="hint usage-empty" hidden data-i18n="html_glossary_empty"></p>

          <div id="glossaryEditor" class="glossary-editor" hidden>
            <div class="glossary-editor-head">
              <h3 id="glossaryEditorTitle" class="glossary-editor-title" data-i18n="html_edit_glossary"></h3>
              <button id="glossaryCloseButton" class="button button-secondary button-compact" type="button" data-i18n="html_close"></button>
            </div>
            <p class="hint" data-i18n="html_glossary_edit_hint"></p>
            <div class="field glossary-title-field">
              <label class="field-label" for="glossaryTitleInput" data-i18n="html_work_title"></label>
              <div class="input-row">
                <input id="glossaryTitleInput" class="text-input" type="text" maxlength="200" autocomplete="off" spellcheck="false" aria-describedby="glossaryTitleHint">
                <button id="glossaryTitleSaveButton" class="button button-primary" type="button" data-i18n-aria-label="html_save_glossary_title_label" hidden data-i18n="html_save"></button>
                <button id="glossaryTitleCancelButton" class="button button-secondary" type="button" data-i18n-aria-label="html_cancel_title_label" hidden data-i18n="html_cancel"></button>
              </div>
              <p id="glossaryTitleHint" class="hint" data-i18n="html_work_title_hint"></p>
            </div>
            <div id="glossaryUndoRow" class="glossary-undo" hidden>
              <span id="glossaryUndoText" class="hint"></span>
              <button id="glossaryUndoButton" class="button button-secondary button-compact" type="button" data-i18n="html_undo_cleanup"></button>
            </div>
            <div class="glossary-table-head" aria-hidden="true">
              <span data-i18n="html_source_name"></span>
              <span data-i18n="html_translation"></span>
              <span data-i18n="html_category"></span>
              <span data-i18n="html_gender"></span>
              <span data-i18n="html_notes"></span>
              <span></span>
            </div>
            <div id="glossaryRows" class="glossary-rows"></div>
            <div id="glossaryPager" class="glossary-pager" role="group" data-i18n-aria-label="html_glossary_pagination" hidden>
              <label class="glossary-pager-field"><span data-i18n="html_per_page"></span>
                <select id="glossaryPageSize" class="select">
                  <option value="30" data-i18n="html_page_size_30"></option>
                  <option value="50" selected data-i18n="html_page_size_50"></option>
                  <option value="100" data-i18n="html_page_size_100"></option>
                </select>
              </label>
              <button id="glossaryPrevButton" class="button button-secondary button-compact" type="button" data-i18n="html_previous_page"></button>
              <label class="glossary-pager-field"><span data-i18n="html_page_number"></span>
                <input id="glossaryPageInput" class="text-input" type="number" min="1" step="1" data-i18n-aria-label="html_page_jump_label" />
              </label>
              <span id="glossaryPageTotal" class="glossary-meta" aria-live="polite"></span>
              <button id="glossaryNextButton" class="button button-secondary button-compact" type="button" data-i18n="html_next_page"></button>
            </div>
            <div class="button-row">
              <button id="glossaryAddButton" class="button button-secondary" type="button" data-i18n="html_add_term"></button>
              <button id="glossarySaveButton" class="button button-primary" type="button" data-i18n="html_save_glossary"></button>
              <button id="glossaryClearButton" class="button button-ghost-danger" type="button" data-i18n="html_clear_glossary"></button>
            </div>
          </div>
          <p id="glossaryFeedback" class="feedback" role="status" aria-live="polite"></p>
        </section>
